services:
  - type: web
    name: seace-export-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PUBLIC_BASE_URL
        value: https://seace-export-api.onrender.com
      - key: DOWNLOAD_TTL_SECONDS
        value: "600"
      - key: MAX_EXACT_DATES
        value: "31"
      - key: MAX_RANGE_DAYS
        value: "31"
      - key: MAX_FILTERED_ROWS
        value: "5000"
      - key: EXPORTS_PER_MINUTE
        value: "12"
      - key: ENABLE_DIRECT_EXPORT
        value: "0"
